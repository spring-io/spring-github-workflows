name: Release Train Build for Gradle

description: 'Builds the project with Gradle (without tests) and publishes artifacts into the local `deployment-repository` directory for the release train.
The artifacts of projects earlier in the train are resolved from the `RELEASE_TRAIN_MAVEN_REPOSITORY_URL` (with `RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME`/`RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD`) env.
The dependencies are resolved via the Maven proxy with `ARTIFACTORY_USERNAME`/`ARTIFACTORY_PASSWORD` env, the commercial one when the `COMMERCIAL` env is set (see `spring-gradle-maven-proxy` action).
All the mentioned env are expected from the generated `release-train-build.yml` workflow step calling the project local `release-train-build` action.'

inputs:
  gradleOptions:
    description: 'Additional Gradle CLI options, e.g. `-x integrationTest`'
    required: false

runs:
  using: composite
  steps:

    - uses: spring-io/spring-github-workflows/.github/actions/spring-gradle-maven-proxy@main

    - name: Build Release
      shell: bash
      run: |
        echo Build Release

        ./gradlew build publishAllPublicationsToDeploymentRepository ${{ inputs.gradleOptions }} -x test --no-build-cache --init-script "$GITHUB_ACTION_PATH/release-train.init.gradle"
