// Adds into all the projects a 'Release Train' Maven repository (RELEASE_TRAIN_MAVEN_REPOSITORY_URL/USERNAME/PASSWORD env)
// to resolve artifacts of projects earlier in the release train.
allprojects {
    afterEvaluate {
        repositories {
            maven {
                name = 'Release Train'
                url = System.getenv('RELEASE_TRAIN_MAVEN_REPOSITORY_URL')
                credentials {
                    username = System.getenv('RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME')
                    password = System.getenv('RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD')
                }
            }
        }
    }
}
