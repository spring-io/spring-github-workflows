import org.gradle.api.artifacts.dsl.RepositoryHandler
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.initialization.resolve.RepositoriesMode

// The init script (installed into '$GRADLE_USER_HOME/init.d' by the 'spring-gradle-maven-proxy' action):
// - injects a Maven proxy repository (MAVEN_PROXY_URL env) in front of all the other repositories
//   to avoid Maven Central rate limiting on hosted runners;
// - excludes all the content from Maven Central repositories since the proxy covers them:
//   otherwise artifacts missing in the proxy (e.g. snapshots) are still looked up in Maven Central,
//   and its '429 Too Many Requests' fails the build.
// The proxy requires credentials (ARTIFACTORY_USERNAME/ARTIFACTORY_PASSWORD env),
// so the script does nothing without them, e.g. for PRs from forks.

def mavenProxyUrl = System.getenv('MAVEN_PROXY_URL')
def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME')
def artifactoryPassword = System.getenv('ARTIFACTORY_PASSWORD')

def enabled = mavenProxyUrl && artifactoryUsername

def addMavenProxyRepository = { RepositoryHandler repositories ->
    if (enabled) {
        repositories.maven {
            name = 'mavenProxy'
            url = mavenProxyUrl
            credentials {
                username = artifactoryUsername
                password = artifactoryPassword
            }
        }
    }
}

def mavenCentralHosts = ['repo.maven.apache.org', 'repo1.maven.org']

def addMavenProxy = { RepositoryHandler repositories ->
    addMavenProxyRepository(repositories)
    if (enabled) {
        repositories.withType(MavenArtifactRepository).configureEach { repository ->
            if (repository.url?.host in mavenCentralHosts) {
                repository.content {
                    excludeGroupByRegex '.*'
                }
            }
        }
    }
}

def repositoriesMode = RepositoriesMode.PREFER_PROJECT

// Use beforeSettings (not settingsEvaluated), so the proxy is the first repository
// for the settings script's own `pluginManagement {}` and `plugins {}` blocks.
gradle.beforeSettings { settings ->
    addMavenProxy(settings.pluginManagement.repositories)
    addMavenProxy(settings.dependencyResolutionManagement.repositories)
}

gradle.settingsEvaluated { settings ->
    repositoriesMode = settings.dependencyResolutionManagement.repositoriesMode.get()
}

gradle.projectsLoaded {
    rootProject.allprojects {
        addMavenProxy(buildscript.repositories)
        // With PREFER_SETTINGS the project repositories are ignored,
        // and FAIL_ON_PROJECT_REPOS fails the build for any of them coming from an init script.
        // The proxy is already in the settings repositories for those modes.
        if (repositoriesMode == RepositoriesMode.PREFER_PROJECT) {
            addMavenProxy(repositories)
        }
    }
}
